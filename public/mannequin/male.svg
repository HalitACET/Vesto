  <!-- RIGHT LEG (Y: 484–680) -->
  <path d="M 262 492 Q 252 492 242 492 Q 248 502 248 518 L 248 590 Q 246 620 246 652 L 247 672 Q 248 682 254 686 L 276 686 Q 282 682 284 672 L 286 652 Q 288 620 286 590 L 280 518 Q 274 500 262 492 Z"
